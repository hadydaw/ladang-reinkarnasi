name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Pastikan secret penandatanganan tersedia
        run: |
          for v in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Secret $v belum diisi di GitHub Settings > Secrets"; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Build browser version (dist/web)
        run: python3 build/build.py

      - name: Create Android project if missing
        run: test -d android || npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Patch Android project (minSdk 26, orientasi, penandatanganan)
        run: python3 build/android_patch.py

      - name: Decode release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK (signed)
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "panjang: path=${#ANDROID_KEYSTORE_PATH} pass=${#ANDROID_KEYSTORE_PASSWORD} alias=${#ANDROID_KEY_ALIAS} keypass=${#ANDROID_KEY_PASSWORD}"
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Verify signature and print certificate SHA-256
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "APK tidak ditemukan"; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/cert.txt"
          echo "### Sertifikat APK" >> "$GITHUB_STEP_SUMMARY"
          grep "SHA-256" "$RUNNER_TEMP/cert.txt" >> "$GITHUB_STEP_SUMMARY"
          cp "$APK" ladang-reinkarnasi.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ladang-reinkarnasi-apk
          path: ladang-reinkarnasi.apk
          if-no-files-found: error
          retention-days: 90
