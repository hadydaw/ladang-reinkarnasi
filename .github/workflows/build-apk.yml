name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm install

      - name: Build browser version (dist/web)
        run: python3 build/build.py

      - name: Create Android project if missing
        run: test -d android || npx cap add android

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Patch Android project (minSdk 26, orientasi)
        run: python3 build/android_patch.py

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ladang-reinkarnasi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
