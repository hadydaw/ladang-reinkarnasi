# Build APK Android native (Godot 4.6.3, tanpa WebView).
# Dijalankan manual (workflow_dispatch) atau saat folder godot/ berubah di main.
# Menghasilkan artefak APK dan bukti isi APK. Tidak membuat GitHub Release.
name: build-godot-apk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/build-godot-apk.yml"

env:
  GODOT_VERSION: "4.6.3"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK bawaan runner - pasang build-tools dan platform
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin | head -1)/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "build-tools;${BUILD_TOOLS}" "platforms;android-35" "platform-tools"
          ls "$SDK/build-tools/${BUILD_TOOLS}/apksigner"

      - name: Cache Godot dan export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-stable-linux-v1

      - name: Unduh Godot dan export templates
        run: |
          mkdir -p ~/godot-cache && cd ~/godot-cache
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          [ -f godot.zip ] || curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          [ -f templates.tpz ] || curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -o -q godot.zip
          chmod +x Godot_v${GODOT_VERSION}-stable_linux.x86_64
          TPL="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          rm -rf "$TPL" && mkdir -p "$TPL"
          rm -rf /tmp/tpl && mkdir -p /tmp/tpl && unzip -o -q templates.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/. "$TPL"/
          ls "$TPL" | head -20

      - name: Konfigurasi editor Godot untuk export Android
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.6.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT

      - name: Keystore rilis (dari GitHub Secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ladang-release.jks"
          test -s "$RUNNER_TEMP/ladang-release.jks"

      - name: Versi kode dari nomor run
        run: |
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" godot/export_presets.cfg
          grep "version/code" godot/export_presets.cfg

      - name: Uji otomatis (headless)
        working-directory: godot
        run: |
          G=~/godot-cache/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          $G --headless --import
          $G --headless -s res://tests/smoke_test.gd

      - name: Build APK rilis
        working-directory: godot
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ runner.temp }}/ladang-release.jks
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          G=~/godot-cache/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p ../build
          $G --headless --export-release "Android" ../build/ladang-reinkarnasi-godot.apk
          ls -l ../build/

      - name: Bukti APK (ukuran, isi, tanda tangan, tanpa WebView)
        run: |
          APK=build/ladang-reinkarnasi-godot.apk
          BUKTI=build/bukti-apk.txt
          {
            echo "Ukuran: $(stat -c %s "$APK") byte"
            echo "--- Isi APK yang berkaitan dengan WebView atau Capacitor (harus kosong) ---"
            unzip -l "$APK" | grep -iE "index\.html|capacitor|webview|cordova" || echo "(tidak ada)"
            echo "--- Pustaka native Godot ---"
            unzip -l "$APK" | grep -E "lib/.*\.so" || echo "(tidak ada)"
            echo "--- Tanda tangan ---"
            "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --print-certs "$APK" | grep -E "Signer|SHA-256" || true
          } | tee "$BUKTI"

      - name: Unggah artefak
        uses: actions/upload-artifact@v4
        with:
          name: ladang-reinkarnasi-godot-apk
          path: |
            build/ladang-reinkarnasi-godot.apk
            build/bukti-apk.txt
          if-no-files-found: error
