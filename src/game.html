:root {
  --bg: #3b2f5c;

body {

  background: var(--bg);

  padding-block: 16px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  overflow-x: hidden;
}

.screen {
  position: fixed; inset: 0; overflow-y: auto;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between;
  padding: 6vh 24px 4vh;
  background:
    radial-gradient(circle at 50% 18%, rgba(255,196,120,.35), transparent 55%),
    linear-gradient(180deg, #3b2f5c 0%, #7a4e8f 45%, #e8a06b 75%, #6b8f3a 76%, #4c6e2a 100%);
  z-index: 0;
}
.screen[hidden] { display: none !important; }

.title-wrap { text-align: center; margin-top: 4vh; }
.game-title {
  margin: 0; font-size: clamp(2.2rem, 11vw, 3.6rem); line-height: 1.05; letter-spacing: 2px;

.menu-buttons { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px; }
.btn {
  width: 100%; min-height: 56px; border: none; border-radius: 16px;
  font-family: inherit; font-weight: 700; font-size: 1.15rem; cursor: pointer; touch-action: manipulation;
  transition: transform .1s ease, filter .2s ease;
}
.btn-primary {
  background: linear-gradient(180deg, var(--accent), var(--accent-dark));
  color: #4a2412; box-shadow: 0 5px 0 var(--shade);
}
.btn-primary:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 var(--shade); }
.btn-primary:disabled { filter: grayscale(.8) brightness(.7); cursor: not-allowed; }
.btn-ghost {
  min-height: 48px; font-size: 1rem; background: rgba(255,255,255,.12); color: var(--ink);
  border: 2px solid rgba(255,240,210,.4);
}
.version { margin: 0; font-size: .75rem; opacity: .6; }

.panel {

      charF: "Rose", charM: "Wang", artF: "Gambar perempuan", artM: "Gambar laki-laki",

      previewNote: "Gambar karakter akan tampil di sini", dirFront: "Depan", dirLeft: "Kiri", dirRight: "Kanan", dirBack: "Belakang"

      ctlMode: "Control mode", ctlJoy: "Joystick", ctlTouch: "Touch",

      accountOk: "Your data is saved to this Claude account. The name is for display only.",
      accountNo: "This page is not connected to a Claude account. Open it with a signed-in account to save progress.",

      loaded: "Save loaded. Gameplay comes in the next stage.",
      createTitle: "Create Character", createSub: "Create the figure who will live this second life in this village.",
      pickChar: "Choose Character", pickOutfit: "Choose Outfit", preview: "Preview",

      outfitName: "Outfit ", charName: "Character Name", charBirth: "Date of Birth",

  const t = (k) => STR[lang][k] || STR.id[k] || k;

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
    $("#set-lang").value = lang;
    renderOutfits();
    renderPreview();
    renderCardArt();
  }

  // Notifikasi di kebun ditaruh tepat di bawah panel Energi, sesuai posisi panel di layar. Di layar lain pakai posisi standar
  function placeToast(el) {
    const hud = document.querySelector("#farm-screen:not([hidden]) .hud-energy");
    if (!hud) { el.style.cssText = ""; return; }
    const r = hud.getBoundingClientRect();
    const left = Math.max(8, r.left), top = Math.max(8, r.bottom + 8);
    el.style.cssText = "box-sizing:border-box;top:" + top + "px;left:" + left + "px;bottom:auto;transform:none;max-width:" + Math.max(150, Math.round(window.innerWidth * 0.46)) + "px";
  }
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg; el.hidden = false;
    placeToast(el);
    clearTimeout(toast._t);
    toast._t = setTimeout(() => (el.hidden = true), 2400);
  }
  function showPanel(name) {
    Object.values(panels).forEach((p) => (p.hidden = true));
    createScreen.hidden = true;
    if (name && panels[name]) { panels[name].hidden = false; menu.hidden = true; }
    else { menu.hidden = false; }
  }
  function ask(text) {
    $("#confirm-text").textContent = text;
    showPanel("confirm");
    return new Promise((resolve) => (confirmResolve = resolve));
  }
  function readJSON(key, fallback) {
    try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
    catch (e) { return fallback; }
  }
  function writeJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  const SLOT_KEY = "ladangReinkarnasi.slot";
  function renderSlots() {
    const list = $("#slot-list"); if (!list) return;
    const en = lang === "en", last = storeGet();
    $("#load-msg").textContent = last ? "" : (en ? "No save yet." : "Belum ada simpanan.");
    list.innerHTML = "";
    const rows = [{ n: 0, title: en ? "Latest save" : "Simpanan terakhir", data: last }];
    for (let n = 1; n <= 3; n++) { const r = readJSON(SLOT_KEY + n, null); rows.push({ n, title: (en ? "Slot " : "Slot ") + n, data: r && r.data ? r.data : null }); }
    rows.forEach((r) => {
      const row = document.createElement("div");
      row.style.cssText = "margin:8px 0;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,0.18);text-align:left";
      const info = document.createElement("div"); info.style.cssText = "margin-bottom:8px";
      const acts = document.createElement("div"); acts.style.cssText = "display:flex;gap:8px";
      const sub = r.data ? ((r.data.name ? r.data.name + " \u00b7 " : "") + window.__ladang.slotLabel(r.data)) : (en ? "Empty" : "Kosong");
      info.innerHTML = '<div style="font-weight:700"></div><div style="font-size:12px;opacity:.85"></div>';
      info.children[0].textContent = r.title; info.children[1].textContent = sub;
      row.appendChild(info);
      const mk = (txt, act, dis) => { const b = document.createElement("button"); b.className = "btn btn-small " + (act === "slot-load" ? "btn-primary" : "btn-ghost"); b.dataset.action = act; b.dataset.slot = r.n; b.textContent = txt; b.disabled = dis; b.style.cssText = "flex:1;width:auto;min-height:42px;padding:6px 10px;font-size:16px"; return b; };
      acts.appendChild(mk(en ? "Load" : "Muat", "slot-load", !r.data));
      if (r.n > 0) acts.appendChild(mk(en ? "Save" : "Simpan", "slot-save", !last));
      if (r.n > 0 && r.data) { // hapus simpanan slot (tidak untuk simpanan terakhir)
        const del = mk(en ? "Delete" : "Hapus", "slot-del", false);
        del.style.background = "#7a2020"; del.style.color = "#fff"; del.style.borderColor = "#e07070";
        acts.appendChild(del);
      }
      row.appendChild(acts);
      list.appendChild(row);
    });
  }
  function renderOutfits() {
    const grid = $("#outfit-grid");
    if (!grid) return;
    grid.innerHTML = "";
    for (let i = 1; i <= OUTFIT_COUNT; i++) {
      const b = document.createElement("button");
      b.className = "choice" + (draft.outfit === i ? " selected" : "");
      b.dataset.action = "outfit";
      b.dataset.outfit = String(i);
      const src = i === 1 && SPRITES[draft.gender] ? SPRITES[draft.gender].depan : null;
      b.innerHTML = '<div class="art">' + (src ? '<img src="' + src + '" alt="">' : "") + '</div><div class="label">' + t("outfitName") + i + "</div>";
      grid.appendChild(b);
    }
  }

    const img = $("#preview-img");

    const src = SPRITES[draft.gender] && SPRITES[draft.gender][dir];

      img.src = src; img.hidden = false;
    } else {
      img.removeAttribute("src"); img.hidden = true;

    if (!b) return isEn() ? "Choose a date" : "Pilih tanggal";
    const se = BIRTH_SEASONS.find((x) => x.id === b.season);
    return (isEn() ? "Season " : "Musim ") + (isEn() ? se.en : se.id_) + " · " + (isEn() ? "Day " : "Tanggal ") + b.day;
  }

  function openBirthPicker() {
    let box = document.getElementById("cal-pick");
    if (!box) {
      box = document.createElement("div");
      box.id = "cal-pick";
      box.hidden = true;
      box.innerHTML = '<div class="cp-card"><p class="cp-title"></p><div class="cp-seasons"></div><div class="cp-days"></div>' +
        '<div class="cp-actions"><button type="button" class="cp-cancel"></button><button type="button" class="cp-ok"></button></div></div>';
      document.body.appendChild(box);
      box.addEventListener("click", (e) => { if (e.target === box) box.hidden = true; });
    }
    let tmp = Object.assign({ season: "spring", day: 1 }, birthPick || {});
    const en = isEn();
    box.querySelector(".cp-title").textContent = en ? "Birth date (game calendar)" : "Tanggal lahir (kalender game)";
    box.querySelector(".cp-cancel").textContent = en ? "Cancel" : "Batal";
    box.querySelector(".cp-ok").textContent = en ? "Choose" : "Pilih";
    const seasonsEl = box.querySelector(".cp-seasons");
    const daysEl = box.querySelector(".cp-days");

      seasonsEl.innerHTML = ""; daysEl.innerHTML = "";
      BIRTH_SEASONS.forEach((se) => {
        const b = document.createElement("button"); b.type = "button";
        b.textContent = en ? se.en : se.id_;
        b.className = tmp.season === se.id ? "cp-on" : "";
        b.addEventListener("click", () => { tmp.season = se.id; draw(); });
        seasonsEl.appendChild(b);
      });
      for (let d = 1; d <= BIRTH_DAYS; d++) {
        const b = document.createElement("button"); b.type = "button"; b.textContent = String(d);
        b.className = tmp.day === d ? "cp-on" : "";
        b.addEventListener("click", () => { tmp.day = d; draw(); });
        daysEl.appendChild(b);
      }
    };
    draw();
    box.querySelector(".cp-cancel").onclick = () => { box.hidden = true; };
    box.querySelector(".cp-ok").onclick = () => { birthPick = { season: tmp.season, day: tmp.day }; renderBirth(); $("#create-msg").textContent = ""; box.hidden = true; };
    box.hidden = false;
  }
  $("#c-birth").addEventListener("click", openBirthPicker);

  function startCreation() {
    draft = { gender: "female", outfit: 1 };
    $("#c-name").value = "";

    $("#create-msg").textContent = "";

    renderOutfits();
    renderPreview();

  // Penyimpanan lokal di browser ini (tanpa akun)
  const SAVE_KEY_LOCAL = "ladangReinkarnasi.game";
  function storeGet() {
    try { const r = localStorage.getItem(SAVE_KEY_LOCAL); return r ? JSON.parse(r) : null; } catch (e) { return null; }
  }
  function storeSet(d) {
    try { localStorage.setItem(SAVE_KEY_LOCAL, JSON.stringify(d)); return true; } catch (e) { return false; }
  }

  async function saveCharacter() {
    const name = draft.gender === "male" ? "Wang" : "Rose"; // dua karakter tetap: Wang (cowok) dan Rose (cewek)
    const birth = birthPick ? { season: birthPick.season, day: birthPick.day, calendar: "ladang" } : null;
    if (!name) { $("#create-msg").textContent = t("nameReq"); return; }

      const okSave = storeSet({

        treeLayout: 2, // dunia baru: zona dan jarak pohon
        eUnit: 8,
        energy: 80,
        seeds: (() => { const o = { lobak: 0, kentang: 0, mentimun: 0, kubis: 0, bayam: 0, tomat: 0 }, pool = ["lobak", "kentang", "kubis", "bayam"]; o[pool[Math.floor(Math.random() * pool.length)]] = 4; return o; })(), // bekal awal: 1 jenis bibit acak x4
        gender: draft.gender,
        outfit: draft.outfit,
        name: name,

        story: { done: false }, // prolog cerita diputar sekali di game baru

      window.__ladang.startFarm();
    } catch (e) {
      $("#create-msg").textContent = t("charFail");
    }
  }


  async function startNewGame() {
    try {
      if (storeGet()) {
        const ok = await ask(t("overwrite"));
        if (!ok) { showPanel(null); return; }
      }
      startCreation();
    } catch (e) {
      toast(t("newFail"));
    }
  }

  async function refreshLoad() {
    $("#load-submit").disabled = true;
    try {
      const data0 = storeGet();
      const snap = { exists: !!data0, data: () => data0 };
      if (snap.exists) {
        $("#load-msg").textContent = t("loadFound") + (snap.data().day || 1) + ".";
        $("#load-submit").disabled = false;
      } else {
        $("#load-msg").textContent = t("loadNone");
      }
    } catch (e) {
      $("#load-msg").textContent = t("loadFail");
    }
  }

  function loadSettings() {
    const s = readJSON(SETTINGS_KEY, { lang: "id", music: true, sfx: true, vibrate: true });
    Object.keys(settingIds).forEach((k) => ($(settingIds[k]).checked = !!s[k]));
    $("#set-lang").value = lang;
  }
  function saveSettings() {
    const s = { lang: lang };
    Object.keys(settingIds).forEach((k) => (s[k] = $(settingIds[k]).checked));
    writeJSON(SETTINGS_KEY, s);
  }
  Object.values(settingIds).forEach((sel) => $(sel).addEventListener("change", saveSettings));
  $("#set-lang").addEventListener("change", (e) => {
    lang = e.target.value === "en" ? "en" : "id";
    applyLang();
    saveSettings();
  });

  document.addEventListener("click", (e) => {
    const btn = e.target.closest("[data-action]");
    if (!btn || btn.disabled) return;
    switch (btn.dataset.action) {
      case "new": startNewGame(); break;
      case "load": renderSlots(); showPanel("load"); break;
      case "slot-load": {
        const n = Number(btn.dataset.slot), rec = n === 0 ? { data: storeGet() } : readJSON(SLOT_KEY + n, null);
        if (!rec || !rec.data) break;
        if (n > 0) storeSet(rec.data);
        window.__ladang.startFarm();
        break;
      }
      case "slot-save": {
        const n = Number(btn.dataset.slot), last = storeGet();
        if (!last) break;
        (async () => {
          if (readJSON(SLOT_KEY + n, null) && !(await ask(lang === "en" ? "Overwrite slot " + n + "?" : "Timpa slot " + n + "?"))) { renderSlots(); showPanel("load"); return; }
          writeJSON(SLOT_KEY + n, { name: last.name || "", label: window.__ladang.slotLabel(last), data: last });
          renderSlots(); showPanel("load");
        })();
        break;
      }
      case "slot-del": {
        const n = Number(btn.dataset.slot);
        (async () => {
          if (!(await ask(lang === "en" ? "Delete slot " + n + "? This cannot be undone." : "Hapus slot " + n + "? Tidak bisa dibatalkan."))) { renderSlots(); showPanel("load"); return; }
          try { localStorage.removeItem(SLOT_KEY + n); } catch (e) {}
          renderSlots(); showPanel("load");
        })();
        break;
      }
      case "load-submit": window.__ladang.startFarm(); break;
      case "settings": loadSettings(); showPanel("settings"); break;
      case "pick-f": draft.gender = "female"; renderGender(); break;
      case "pick-m": draft.gender = "male"; renderGender(); break;
      case "outfit": draft.outfit = Number(btn.dataset.outfit); renderOutfits(); renderPreview(); break;
      case "dir": dir = btn.dataset.dir; renderPreview(); break;
      case "create-save": saveCharacter(); break;
      case "create-back": showPanel(null); break;
      case "confirm-yes": if (confirmResolve) confirmResolve(true); confirmResolve = null; showPanel(null); break;
      case "confirm-no": if (confirmResolve) confirmResolve(false); confirmResolve = null; showPanel(null); break;
      case "back": if (confirmResolve) confirmResolve(false); confirmResolve = null; showPanel(null); break;
    }
  });

  // Bahasa dibaca dari pengaturan yang tersimpan sebelum halaman ditampilkan
  lang = readJSON(SETTINGS_KEY, { lang: "id" }).lang === "en" ? "en" : "id";
  applyLang();
  renderCardArt();

  window.__ladang = {
    store: { get: storeGet, set: storeSet }, get lang() { return lang; },
    toast: toast, sprites: SPRITES, spriteWalk: SPRITE_WALK, showMenu: function () { showPanel(null); }
  };

})();
</script>

  // Hotbar: geser viewport untuk menampilkan slot ke-7. Ikon tetap di dalam slotnya (track bergeser sebagai satu kesatuan)
  let hbOff = 0, hbMoved = false, hb0 = null, hbStart = 0;
  function setHbOff(v) {
    const t = document.querySelector("#f-tools .tool-track");
    const N = t ? (+t.dataset.n || 7) : 7;
    hbOff = Math.max(0, Math.min(Math.max(0, N - HB_VIS), v)); // satuan: jumlah slot yang tergeser

  (function setupHotbarSwipe() {
    const el = document.getElementById("f-tools");
    if (!el) return;
    const track = () => el.querySelector(".tool-track");
    const onMove = (e) => {
      if (hb0 === null) return;
      const dx = e.clientX - hb0;
      if (!hbMoved && Math.abs(dx) < 8) return; // di bawah ambang: masih dianggap tap
      if (!hbMoved) { hbMoved = true; const t = track(); if (t) t.classList.add("dragging"); }
      setHbOff(hbStart - dx / (el.clientWidth / 6));
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      if (hb0 === null) return;
      hb0 = null;
      const t = track(); if (t) t.classList.remove("dragging");
      if (hbMoved) setHbOff(Math.round(hbOff)); // snap ke slot
    };
    el.addEventListener("pointerdown", (e) => {
      hbMoved = false; hb0 = e.clientX; hbStart = hbOff;
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
      window.addEventListener("pointercancel", onUp);
    });
    el.addEventListener("dragstart", (e) => e.preventDefault()); // ikon tidak boleh ditarik sebagai gambar (membatalkan geser)
    el.addEventListener("wheel", (e) => {
      const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 4) return;
      e.preventDefault(); setHbOff(hbOff + (d > 0 ? 1 : -1));
    }, { passive: false });
  })();

  function setupJoy() {
    const joyEl = $("#joy"), knob = $("#joy-knob");
    const R = 50;
    let pid = null; // id jari yang menggerakkan joystick, supaya jari lain (tombol Pakai) tidak ikut menghentikannya
    const set = (e) => {
      const r = joyEl.getBoundingClientRect(); const sc = (r.width / joyEl.offsetWidth) || 1;
      let dx = (e.clientX - (r.left + r.width / 2)) / sc, dy = (e.clientY - (r.top + r.height / 2)) / sc;
      const d = Math.hypot(dx, dy);
      if (d > R) { dx = dx / d * R; dy = dy / d * R; }
      joy.vx = dx / R; joy.vy = dy / R;
      knob.style.transform = "translate(" + dx + "px," + dy + "px)";
    };
    const end = () => { joy.active = false; pid = null; joy.vx = 0; joy.vy = 0; knob.style.transform = ""; };
    joyEl.addEventListener("pointerdown", (e) => {
      if (pid !== null) return;
      pid = e.pointerId; joy.active = true;
      joyEl.setPointerCapture(e.pointerId); set(e);
    });
    window.addEventListener("pointermove", (e) => { if (joy.active && e.pointerId === pid) set(e); });
    window.addEventListener("pointerup", (e) => { if (joy.active && e.pointerId === pid) end(); });
    window.addEventListener("pointercancel", (e) => { if (joy.active && e.pointerId === pid) end(); });
  }
